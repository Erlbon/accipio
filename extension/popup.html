<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; width: 260px; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #222; } button { color: #ddd; background: #333; border-color: #555; } }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  label { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
  button { width: 100%; padding: 6px; margin: 6px 0; border: 1px solid #bbb; border-radius: 4px; background: #f4f4f4; cursor: pointer; }
  #status { font-size: 12px; opacity: 0.75; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Accipio</h1>
  <label><input type="checkbox" id="takeover"> Send downloads to Accipio</label>
  <button id="grab">Download this page's video</button>

  <script type="module" src="popup.js"></script>

</html>
